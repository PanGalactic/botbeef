<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>BOT BEEF — Rap Evidence</title>
<link rel="stylesheet" href="/css/tekken.css">
<link rel="stylesheet" href="/css/mode-switcher.css">
<style>
  /* Aliases onto the shared Tekken theme in css/tekken.css, which owns the
     values. Bot A takes P1 red, bot B takes P2 cyan. */
  :root{
    --bg:var(--tk-steel-0); --panel:var(--tk-steel-1); --line:var(--tk-line);
    --ink:var(--tk-ink); --dim:var(--tk-dim);
    --a:var(--tk-p1);      /* bot A */
    --b:var(--tk-p2);      /* bot B */
    --warn:var(--tk-danger);
    --mono:var(--tk-mono);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    color:var(--ink);
    font:700 16px/1.5 var(--tk-display);
    height:100vh; display:flex; flex-direction:column; overflow:hidden;
    background:
      linear-gradient(115deg, #ff23181a, transparent 30%),
      linear-gradient(245deg, #1cd2ff1a, transparent 30%),
      radial-gradient(ellipse at 50% 0%, var(--tk-steel-2) 0, #0b1016 46%, #030405 100%);
  }
  /* scanline pass over the whole evidence view */
  body::after{
    content:""; position:fixed; inset:0; z-index:99; pointer-events:none;
    opacity:.11; mix-blend-mode:multiply;
    background:repeating-linear-gradient(180deg, transparent 0 3px, #00000099 4px);
  }

  header{
    display:flex; align-items:center; gap:18px;
    /* wrap rather than clip: the control row is wider than a 1000px viewport,
       which used to push the BATTLE button off-screen entirely. */
    flex-wrap:wrap; row-gap:10px;
    padding:12px 22px; flex:0 0 auto;
    border-bottom:1px solid var(--line);
    background:linear-gradient(180deg,#182230f2,#080b0ff2);
    box-shadow:inset 0 1px #ffffff1a, 0 6px 20px #0009;
  }
  h1{
    font-size:30px; font-style:italic; font-weight:900;
    letter-spacing:-.035em; text-transform:uppercase;
    text-shadow:3px 3px 0 #050608, 0 0 26px #ffffff26;
    transform:skewX(-4deg);
  }
  h1 em{font-style:inherit; color:#ff4637}
  .tag{
    font:700 10px/1 var(--mono);
    letter-spacing:.16em; text-transform:uppercase;
    padding:6px 10px; border:1px solid currentColor; border-radius:0;
    background:#05070a99; color:var(--dim);
  }
  .tag.bad{color:var(--warn)}
  .tag.good{color:var(--tk-ok)}
  .spacer{flex:1}

  select,button{
    color:var(--ink); border:1px solid var(--tk-line-hi); border-radius:0;
    padding:10px 12px; cursor:pointer;
    font:700 14px/1 var(--tk-display); letter-spacing:.04em;
    background:
      linear-gradient(180deg,#ffffff1a,transparent 44%),
      linear-gradient(90deg,#222b34,var(--tk-steel-1));
    box-shadow:inset 0 0 0 2px #00000099;
  }
  select:focus-visible,button:focus-visible{outline:2px solid #fff; outline-offset:2px}
  select{min-width:0}
  #beatSelect{max-width:190px}
  button.play{
    border-color:var(--a); color:#05070a;
    font:700 12px/1 var(--mono); letter-spacing:.16em; text-transform:uppercase;
    padding:11px 24px;
    background:linear-gradient(180deg,#ff7a63,var(--a) 46%,#d62a20);
    box-shadow:inset 0 0 0 2px #000, 0 0 22px #ff3a2f66;
    /* sheared with clip-path so the label stays upright */
    clip-path:polygon(11px 0, 100% 0, calc(100% - 11px) 100%, 0 100%);
  }
  button.play:hover:not(:disabled){border-color:#fff; box-shadow:inset 0 0 0 2px #000, 0 0 30px #ff3a2f99}
  button:disabled{opacity:.42; cursor:not-allowed}

  main{flex:1; display:grid; grid-template-columns:minmax(0,1.05fr) minmax(0,1fr); min-height:0}
  section{padding:18px 22px; min-height:0; display:flex; flex-direction:column}
  section + section{border-left:1px solid var(--line)}

  .cap{
    font:700 10px/1 var(--mono); letter-spacing:.2em;
    text-transform:uppercase; color:var(--tk-warning); margin-bottom:6px;
  }
  .sub{font:700 13px/1.5 var(--mono); color:var(--dim); margin-bottom:10px; letter-spacing:.03em}
  .sub b{color:var(--tk-chrome); font-variant-numeric:tabular-nums}

  svg{flex:1; width:100%; min-height:0}
  .grid{stroke:var(--line); stroke-width:1}
  .fit{stroke:#4a5163; stroke-width:2; stroke-dasharray:7 6}
  .dot{fill:#525a6e}
  .dot.hi-a{fill:var(--a)} .dot.hi-b{fill:var(--b)}
  .lbl{font-size:11px; fill:var(--dim); font-family:var(--mono)}
  .lbl.hi{font-size:16px; font-weight:900; font-style:italic}
  .lbl.hi-a{fill:var(--a)} .lbl.hi-b{fill:var(--b)}
  .axis{font-size:11px; fill:var(--dim); letter-spacing:.16em; font-family:var(--mono)}
  .resid{stroke:#6c7488; stroke-width:1.5; stroke-dasharray:3 4}

  #bars{flex:1; overflow-y:auto; display:flex; flex-direction:column; gap:12px; padding-right:6px}
  .bar{
    border-left:4px solid var(--tk-steel-3); padding:10px 0 10px 15px;
    opacity:.34; transition:opacity .18s, background .18s;
  }
  .bar.a{border-left-color:var(--a)} .bar.b{border-left-color:var(--b)}
  .bar.on{opacity:1}
  .bar.on .txt{color:var(--ink)}
  /* the live bar lights its own side, like a hit landing */
  .bar.a.on{background:linear-gradient(90deg,#ff3a2f1f,transparent 42%)}
  .bar.b.on{background:linear-gradient(90deg,#27d9ff1f,transparent 42%)}
  .who{
    font:700 10px/1 var(--mono); letter-spacing:.18em;
    text-transform:uppercase; margin-bottom:6px;
  }
  .bar.a .who{color:var(--a)} .bar.b .who{color:var(--b)}
  .txt{font-size:24px; line-height:1.3; font-weight:900; font-style:italic; color:#cfd5e2}
  .cite{
    margin-top:8px; font:700 11px/1.5 var(--mono); letter-spacing:.04em;
    color:var(--dim); border-top:1px solid var(--line); padding-top:7px;
  }
  .cite b{color:var(--tk-ok)}
  .empty{
    color:var(--dim); font:700 12px/1.7 var(--mono); letter-spacing:.1em;
    margin:auto; text-align:center; max-width:38ch; text-transform:uppercase;
  }

  /* Narrow screens: the chart and the bars cannot share a row at phone width,
     and the wrapped control header needs the document to scroll. */
  @media (max-width:760px){
    body{height:auto; min-height:100vh; overflow-y:auto}
    header{gap:10px; padding:10px 14px}
    h1{font-size:24px}
    main{grid-template-columns:1fr}
    section{min-height:0; padding:16px 14px}
    section + section{border-left:0; border-top:1px solid var(--line)}
    #chart{min-height:340px}
    #bars{flex:none; overflow:visible}
    .txt{font-size:20px}
  }
</style>
</head>
<body>

<header>
  <h1>BOT <em>BEEF</em></h1>
  <span class="tag" id="prov">loading…</span>
  <div class="spacer"></div>
  <nav class="mode-nav mode-nav--header" aria-label="Bot Beef modes">
    <a href="/">Modes</a>
    <a href="/rap">Rap</a>
    <a href="/data" aria-current="page">Data</a>
    <a href="/fight">Fight</a>
  </nav>
  <select id="beatSelect" aria-label="Rap beat">
    <option value="auto">Auto beat</option>
  </select>
  <select id="selA"></select>
  <span style="color:var(--dim)">vs</span>
  <select id="selB"></select>
  <button class="play" id="play">▶ BATTLE</button>
</header>

<main>
  <section>
    <div class="cap">Hype vs record &mdash; every bot, one chart</div>
    <div class="sub" id="chartSub">&nbsp;</div>
    <svg id="chart" viewBox="0 0 640 600" preserveAspectRatio="xMidYMid meet"></svg>
  </section>

  <section>
    <div class="cap">Rap battle mode &mdash; every bar cites a scraped fact</div>
    <div class="sub" id="battleSub">&nbsp;</div>
    <div id="bars"><div class="empty">Pick two bots and hit BATTLE.</div></div>
  </section>
</main>

<audio id="beat" loop></audio>
<audio id="au"></audio>

<script type="module">
import {
  RapAudioController,
  selectBeatForMatchup,
} from "/js/rap-audio.js";

const $ = s => document.querySelector(s);
let TABLE = null, BATTLE = null, BEATS = [], PLAYABLE = [], NAMES = new Map();

const rapAudio = new RapAudioController({
  voiceElement: $('#au'),
  beatElement: $('#beat'),
  onStep: step => {
    document.querySelectorAll('.bar.on').forEach(e => e.classList.remove('on'));
    if (step.index < 0) return;
    const el = $('#bar' + step.index);
    if (el) {
      el.classList.add('on');
      el.scrollIntoView({ block: 'center', behavior: 'smooth' });
    }
  },
  onComplete: () => { $('#play').disabled = false; },
  onStatus: message => {
    const status = $('#audioStatus');
    if (status) status.textContent = ` · ${message}`;
  },
});

const fmt = n => (n > 0 ? '+' : '') + n.toFixed(1);

function isPlayablePair(a, b){
  return PLAYABLE.some(pair =>
    (pair.a === a && pair.b === b) || (pair.a === b && pair.b === a)
  );
}

function playablePartners(slug){
  const partners = new Set();
  for (const pair of PLAYABLE) {
    if (pair.a === slug) partners.add(pair.b);
    if (pair.b === slug) partners.add(pair.a);
  }
  return partners;
}

function optionMarkup(row){
  return `<option value="${esc(row.slug)}">${esc(canonicalName(row.slug, row.name))}</option>`;
}

function canonicalName(slug, fallback = ''){
  return NAMES.get(slug) || fallback || String(slug || '').replaceAll('-', ' ');
}

function syncOpponentOptions(preferred = ''){
  const partners = playablePartners($('#selA').value);
  const rows = TABLE.rows.filter(row => partners.has(row.slug));
  $('#selB').innerHTML = rows.map(optionMarkup).join('');
  $('#selB').disabled = rows.length === 0;
  if (preferred && partners.has(preferred)) $('#selB').value = preferred;
  $('#play').disabled = rows.length === 0;
}

async function boot(){
  const [t, cached, beatData, identityData] = await Promise.all([
    fetch('/api/table').then(r => r.json()),
    fetch('/api/battles').then(r => r.json()),
    fetch('/beats/beats.json').then(r => r.ok ? r.json() : { beats: [] }).catch(() => ({ beats: [] })),
    fetch('/data/robot-identities.json')
      .then(r => r.ok ? r.json() : { robots: [] })
      .catch(() => ({ robots: [] }))
  ]);
  TABLE = t;
  BEATS = Array.isArray(beatData.beats) ? beatData.beats : [];
  NAMES = new Map(
    (Array.isArray(identityData.robots) ? identityData.robots : [])
      .filter(robot => typeof robot?.id === 'string' && typeof robot?.name === 'string')
      .map(robot => [robot.id, robot.name])
  );
  $('#beatSelect').innerHTML = '<option value="auto">Auto · matchup theme</option>' +
    BEATS.map(beat =>
      `<option value="${esc(beat.slug)}">${esc(beat.style)} · ${beat.bpm} BPM</option>`
    ).join('');

  const p = t.provenance;
  const prov = $('#prov');
  if (p.is_real) {
    prov.className = 'tag good';
    prov.textContent = `${p.fights_real} fights · ${p.posts_real} posts · scraped`;
  } else {
    prov.className = 'tag bad';
    prov.textContent = `⚠ placeholder data — ${p.fights_real}/${p.fights_total} fights scraped`;
  }

  const rows = t.rows;
  // Default to a matchup that has a battle on disk AND whose bots are both
  // still in the roster. Those two sets drift apart every time the data is
  // re-ingested — a cached battle for a bot that has since dropped out
  // selects nothing, and the demo dies on the first click.
  const slugs = new Set(rows.map(r => r.slug));
  PLAYABLE = (cached.battles || []).filter(
    b => b.playable === true && slugs.has(b.a) && slugs.has(b.b)
  );
  const readySlugs = new Set(PLAYABLE.flatMap(pair => [pair.a, pair.b]));
  $('#selA').innerHTML = rows
    .filter(row => readySlugs.has(row.slug))
    .map(optionMarkup)
    .join('');
  $('#selA').disabled = PLAYABLE.length === 0;
  if (PLAYABLE.length) {
    const first = PLAYABLE[0];
    $('#selA').value = first.a;
    syncOpponentOptions(first.b);
  } else {
    $('#selB').innerHTML = '';
    $('#selB').disabled = true;
    $('#play').disabled = true;
    $('#bars').innerHTML = `<div class="empty"><strong>No verified rap battles are ready.</strong><br><br>
      Cached drafts stay hidden until their citations, provenance, and audio pass validation.</div>`;
  }

  $('#chartSub').innerHTML =
    `<b>${rows.length}</b> bots · fitted line r=<b>${t.fit.r}</b> · ` +
    `above the line = the crowd rates them higher than the record earns`;

  // Mark which matchups can actually be played, so nobody picks a pair with
  // no cached battle and gets a 404 on stage.
  const ready = new Set(PLAYABLE.flatMap(b => [b.a, b.b]));
  for (const sel of [$('#selA'), $('#selB')])
    for (const opt of sel.options)
      if (ready.has(opt.value)) opt.textContent = '● ' + opt.textContent;

  draw();
  $('#selA').onchange = () => {
    syncOpponentOptions();
    draw();
  };
  $('#selB').onchange = draw;
}

function selectedBeat(a, b){
  const explicit = $('#beatSelect').value;
  return explicit === 'auto'
    ? selectBeatForMatchup(a, b, BEATS)
    : BEATS.find(beat => beat.slug === explicit) || selectBeatForMatchup(a, b, BEATS);
}

function draw(){
  const a = $('#selA').value, b = $('#selB').value;
  const rows = TABLE.rows, fit = TABLE.fit;
  const W = 640, H = 600, L = 54, R = 18, T = 16, B = 44;

  // Label only the story: the two combatants, plus the three most overrated
  // and three most underrated. A 24-label wall reads as noise on a projector.
  const sorted = [...rows].sort((p, q) => q.residual - p.residual);
  const named = new Set([
    ...sorted.slice(0, 3).map(r => r.slug),
    ...sorted.slice(-3).map(r => r.slug),
  ]);
  const xs = rows.map(r => r.performance), ys = rows.map(r => r.hype);
  const pad = 6;
  const x0 = Math.min(...xs) - pad, x1 = Math.max(...xs) + pad;
  const y0 = Math.min(...ys) - pad, y1 = Math.max(...ys) + pad;
  const px = v => L + (v - x0) / (x1 - x0) * (W - L - R);
  const py = v => H - B - (v - y0) / (y1 - y0) * (H - T - B);

  let s = '';
  for (let i = 0; i <= 4; i++){
    const gy = T + i * (H - T - B) / 4;
    s += `<line class="grid" x1="${L}" y1="${gy}" x2="${W - R}" y2="${gy}"/>`;
  }
  s += `<line class="fit" x1="${px(x0)}" y1="${py(fit.slope * x0 + fit.intercept)}"
             x2="${px(x1)}" y2="${py(fit.slope * x1 + fit.intercept)}"/>`;

  for (const r of rows){
    const hi = r.slug === a ? 'hi-a' : r.slug === b ? 'hi-b' : '';
    if (hi){
      const ey = fit.slope * r.performance + fit.intercept;
      s += `<line class="resid" x1="${px(r.performance)}" y1="${py(r.hype)}"
                  x2="${px(r.performance)}" y2="${py(ey)}"/>`;
    }
    s += `<circle class="dot ${hi}" cx="${px(r.performance)}" cy="${py(r.hype)}" r="${hi ? 9 : 4.5}"/>`;
    if (hi || named.has(r.slug)){
      s += `<text class="lbl ${hi ? 'hi ' + hi : ''}" x="${px(r.performance) + (hi ? 14 : 8)}"
                  y="${py(r.hype) + 4}">${esc(canonicalName(r.slug, r.name))} ${fmt(r.residual)}</text>`;
    }
  }

  s += `<text class="axis" x="${(W + L) / 2}" y="${H - 10}" text-anchor="middle">PERFORMANCE — record, margin &amp; opponent strength →</text>`;
  s += `<text class="axis" transform="translate(16,${(H - B + T) / 2}) rotate(-90)" text-anchor="middle">FAN HYPE — volume &amp; sentiment →</text>`;
  $('#chart').innerHTML = s;
}

async function playBattle(){
  const a = $('#selA').value, b = $('#selB').value;

  // Never fail silently. An empty select and "same bot twice" both used to
  // hit `a === b` and return without a word, which looks exactly like a
  // dead button — that is how the demo broke.
  if (!a || !b){
    $('#bars').innerHTML = `<div class="empty">No fighters selected.<br><br>
      The roster changed after the last data ingest. Reload the page.</div>`;
    return;
  }
  if (a === b){
    $('#bars').innerHTML = `<div class="empty">Pick two <em>different</em> bots.</div>`;
    return;
  }
  if (!isPlayablePair(a, b)){
    $('#bars').innerHTML = `<div class="empty">That matchup is not verified for playback.
      Choose one of the available opponents.</div>`;
    return;
  }
  rapAudio.stop();
  $('#play').disabled = true;
  $('#bars').innerHTML = '<div class="empty">loading…</div>';

  let d;
  try {
    const res = await fetch(`/api/battle/${a}/${b}`);
    if (!res.ok) throw new Error((await res.text()).slice(0, 200));
    d = await res.json();
  } catch (e) {
    $('#bars').innerHTML = `<div class="empty">No battle cached for this pair.<br><br>
      <code style="font-size:13px">python3 ingest/pregen.py ${a} ${b}</code></div>`;
    $('#play').disabled = false;
    return;
  }

  BATTLE = d;
  const beat = selectedBeat(a, b);
  const ra = TABLE.rows.find(r => r.slug === a), rb = TABLE.rows.find(r => r.slug === b);
  const nameA = canonicalName(a, d.names?.[a]);
  const nameB = canonicalName(b, d.names?.[b]);
  $('#battleSub').innerHTML =
    `<b>${esc(nameA)}</b> ${ra ? fmt(ra.residual) : ''} hype residual · ` +
    `<b>${esc(nameB)}</b> ${rb ? fmt(rb.residual) : ''} · ` +
    `<b>${d.bars.length}</b> bars, <b>${d.bars.length}</b> sourced` +
    (d.rejected.length ? ` · <span style="color:var(--warn)">${d.rejected.length} rejected as unsourced</span>` : '');

  if (beat) {
    $('#battleSub').innerHTML +=
      ` · beat: <b>${esc(beat.title)}</b> (${esc(beat.style)}, ${beat.bpm} BPM)`;
  }
  $('#battleSub').insertAdjacentHTML('beforeend', '<span id="audioStatus"></span>');

  $('#bars').innerHTML = d.bars.map((x, i) => `
    <div class="bar ${x.bot === a ? 'a' : 'b'}" id="bar${i}">
      <div class="who">${esc(canonicalName(x.bot, d.names?.[x.bot]))}</div>
      <div class="txt">${esc(x.text)}</div>
      <div class="cite"><b>${x.fact_id}</b> ${esc(x.fact)}</div>
    </div>`).join('');

  if (d.audio) {
    rapAudio.play({ manifest: d.audio, bars: d.bars, beat });
  } else {
    d.bars.forEach((_, i) => $('#bar' + i).classList.add('on'));
    $('#audioStatus').textContent = ' · Voice manifest unavailable; showing lyrics only.';
    $('#play').disabled = false;
  }
}

function esc(s){ return String(s).replace(/[&<>]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c])); }

$('#play').onclick = playBattle;
boot();
</script>
</body>
</html>
