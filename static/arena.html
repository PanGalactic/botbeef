<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#05070a">
<title>BOT BEEF — Robot Combat Arena</title>
<link rel="stylesheet" href="/css/arena-fighter.css">
<style>
  *{box-sizing:border-box}
  html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#030507}
  body{color:#fff;font-family:"Arial Narrow","Roboto Condensed","Segoe UI",sans-serif}
  #stage{position:fixed;inset:0;background:#030507}
  #stage canvas{display:block;width:100%;height:100%;touch-action:none}
  #stage-loading{position:fixed;z-index:10;inset:0;display:grid;place-items:center;
    color:#aab8c4;background:#030507;font:700 12px/1.2 ui-monospace,monospace;
    letter-spacing:.28em;text-transform:uppercase;transition:opacity .35s}
  #stage-loading.is-ready{opacity:0;pointer-events:none}
  .arena-back{position:fixed;z-index:80;left:14px;bottom:14px;padding:8px 11px;
    color:#a9b5bf;background:#06090dbd;border:1px solid #8b98a64d;
    font:700 10px/1 ui-monospace,monospace;letter-spacing:.12em;
    text-decoration:none;text-transform:uppercase;pointer-events:auto}
  .arena-back:hover,.arena-back:focus-visible{color:#fff;border-color:#fff}
  @media (max-width:620px){.arena-back{display:none}}
  @media (pointer:coarse) and (max-width:1000px){.arena-back{display:none}}

  /* Sourced-fact ticker. The fighter MVP's combat is live physics with
     invented move names (Voodoo Jab, Six Feet Under) — there is no bar or
     fact_id here to attach a citation to. This strip is the honest version:
     real cited stats from /api/facts, surfaced during the match rather than
     claimed to be what any single attack "is". See COMMS 20:18 UTC. */
  #cite-ticker{position:fixed;z-index:60;left:50%;bottom:14px;
    transform:translateX(-50%);max-width:min(640px,86vw);
    padding:9px 16px;border-radius:7px;text-align:center;
    background:rgba(3,5,8,.78);border:1px solid rgba(255,255,255,.14);
    font:13px/1.5 ui-monospace,Menlo,monospace;color:#c7d0dc;
    opacity:0;transition:opacity .35s;pointer-events:none}
  #cite-ticker.is-visible{opacity:1}
  #cite-ticker b{color:#2ee6a8;margin-right:8px}
  @media (max-width:620px){#cite-ticker{font-size:11px;bottom:8px}}
</style>
</head>
<body>
<main id="stage" aria-label="3D robot combat arena"></main>
<div id="stage-loading">Powering the BattleBox…</div>
<div id="fighter-ui-root"></div>
<div id="cite-ticker"></div>
<a class="arena-back" href="/" aria-label="Return to data view">Data view</a>

<script type="module">
import * as THREE from "/vendor/three.module.js";
import { CombatEngine } from "/js/combat-engine.js";
import { ROBOT_LIST, getRobotById } from "/js/roster.js";
import { createFighterUI } from "/js/fighter-select.js";

const stage = document.querySelector("#stage");
const loading = document.querySelector("#stage-loading");
const textureLoader = new THREE.TextureLoader();
const clock = new THREE.Clock();

let scene;
let camera;
let renderer;
let engine = null;
let ui = null;
let paused = false;
let roundFreezeUntil = 0;
let shake = 0;
let currentMatchToken = 0;
let fighterVisuals = {};
const sparks = [];
const cameraTarget = new THREE.Vector3();
const desiredCamera = new THREE.Vector3();
const sparkGeometry = new THREE.BoxGeometry(.12, .035, .035);
const sparkMaterial = new THREE.MeshBasicMaterial({color:0xffb02e});
const combo = {
  p1: {count:0, last:0},
  p2: {count:0, last:0},
};
const audioState = {
  context:null,
  muted:false,
};

function ensureAudio(){
  if (audioState.muted) return null;
  const AudioContextClass = window.AudioContext || window.webkitAudioContext;
  if (!AudioContextClass) return null;
  if (!audioState.context) audioState.context = new AudioContextClass();
  if (audioState.context.state === "suspended"){
    audioState.context.resume().catch(() => {});
  }
  return audioState.context;
}

function playTone(frequency, duration=.12, options={}){
  const context = ensureAudio();
  if (!context) return;
  const now = context.currentTime;
  const oscillator = context.createOscillator();
  const gain = context.createGain();
  const volume = options.volume ?? .045;
  oscillator.type = options.type || "square";
  oscillator.frequency.setValueAtTime(Math.max(30, frequency), now);
  oscillator.frequency.exponentialRampToValueAtTime(
    Math.max(30, options.endFrequency || frequency),
    now + duration,
  );
  gain.gain.setValueAtTime(.0001, now);
  gain.gain.exponentialRampToValueAtTime(volume, now + .008);
  gain.gain.exponentialRampToValueAtTime(.0001, now + duration);
  oscillator.connect(gain);
  gain.connect(context.destination);
  oscillator.start(now);
  oscillator.stop(now + duration + .015);
}

function playCombatSound(event){
  if (event.type === "match-start"){
    ensureAudio();
  } else if (event.type === "round-start"){
    playTone(170, .18, {endFrequency:260, type:"triangle", volume:.035});
  } else if (event.type === "attack-start"){
    const frequencies = [150, 115, 88, 62];
    playTone(frequencies[event.attack?.index] || 100, .09, {
      endFrequency:45,
      type:"sawtooth",
      volume:.025,
    });
  } else if (event.type === "hit"){
    playTone(80 + Math.min(120, event.damage * 4), .13, {
      endFrequency:42,
      type:"square",
      volume:.055,
    });
  } else if (event.type === "block"){
    playTone(560, .1, {endFrequency:230, type:"triangle", volume:.045});
  } else if (event.type === "ko"){
    playTone(95, .62, {endFrequency:32, type:"sawtooth", volume:.07});
  } else if (event.type === "match-end"){
    playTone(185, .24, {endFrequency:245, type:"triangle", volume:.04});
    setTimeout(() => playTone(280, .32, {endFrequency:390, type:"triangle", volume:.04}), 210);
  }
}

function toggleAudio(){
  audioState.muted = !audioState.muted;
  if (!audioState.muted) ensureAudio();
  ui?.setStatus("player", audioState.muted ? "SOUND OFF" : "SOUND ON", "neutral", 900);
}

function initScene(){
  scene = new THREE.Scene();
  scene.background = new THREE.Color(0x030507);
  scene.fog = new THREE.FogExp2(0x05080d, .027);

  camera = new THREE.PerspectiveCamera(44, innerWidth / innerHeight, .1, 180);
  camera.position.set(0, 5.8, 15.5);

  renderer = new THREE.WebGLRenderer({antialias:true, powerPreference:"high-performance"});
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  renderer.setSize(innerWidth, innerHeight);
  renderer.outputColorSpace = THREE.SRGBColorSpace;
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1.16;
  stage.append(renderer.domElement);

  const floorMaterial = new THREE.MeshStandardMaterial({
    color:0x6d7783,
    roughness:.68,
    metalness:.42,
  });
  textureLoader.load("/arena/floor.png", (map) => {
    map.colorSpace = THREE.SRGBColorSpace;
    map.wrapS = map.wrapT = THREE.RepeatWrapping;
    map.repeat.set(3.6, 2.2);
    floorMaterial.map = map;
    floorMaterial.needsUpdate = true;
  });
  const floor = new THREE.Mesh(new THREE.PlaneGeometry(19, 11), floorMaterial);
  floor.rotation.x = -Math.PI / 2;
  floor.position.y = -.03;
  scene.add(floor);

  const grid = new THREE.GridHelper(18, 18, 0xaab7c6, 0x4c5967);
  grid.position.y = .015;
  grid.material.transparent = true;
  grid.material.opacity = .18;
  scene.add(grid);

  textureLoader.load("/arena/arena.png", (map) => {
    map.colorSpace = THREE.SRGBColorSpace;
    map.wrapS = THREE.RepeatWrapping;
    map.repeat.x = 2;
    const backdrop = new THREE.Mesh(
      new THREE.CylinderGeometry(35, 35, 26, 64, 1, true),
      new THREE.MeshBasicMaterial({
        map,
        side:THREE.BackSide,
        color:0x8996a8,
        fog:false,
      }),
    );
    backdrop.position.y = 11;
    scene.add(backdrop);
  });

  addArenaWalls();
  scene.add(new THREE.HemisphereLight(0x93b8ff, 0x160b08, 2.35));

  const key = new THREE.SpotLight(0xffffff, 360, 50, .54, .55, 1.4);
  key.position.set(0, 17, 8);
  scene.add(key);

  const redRim = new THREE.PointLight(0xff2b1f, 210, 26, 2);
  redRim.position.set(-8, 3.2, 1);
  scene.add(redRim);
  const blueRim = new THREE.PointLight(0x22d8ff, 210, 26, 2);
  blueRim.position.set(8, 3.2, 1);
  scene.add(blueRim);

  for (let x = -8; x <= 8; x += 4){
    const lamp = new THREE.PointLight(x < 0 ? 0xff3c27 : 0x36cfff, 30, 16, 2);
    lamp.position.set(x, 9.5, -4.5);
    scene.add(lamp);
  }

  addEventListener("resize", resize);
  loading.classList.add("is-ready");
}

function addArenaWalls(){
  const railMaterial = new THREE.MeshStandardMaterial({
    color:0x26303a,
    roughness:.33,
    metalness:.86,
    emissive:0x080b0f,
  });
  const stripeMaterial = new THREE.MeshBasicMaterial({color:0xff9f17});
  const rails = [
    {x:0, z:-5.25, w:19, d:.18},
    {x:0, z:5.25, w:19, d:.18},
    {x:-9.25, z:0, w:.18, d:10.5},
    {x:9.25, z:0, w:.18, d:10.5},
  ];
  for (const rail of rails){
    const mesh = new THREE.Mesh(new THREE.BoxGeometry(rail.w, .65, rail.d), railMaterial);
    mesh.position.set(rail.x, .32, rail.z);
    scene.add(mesh);
    const stripe = new THREE.Mesh(new THREE.BoxGeometry(rail.w, .04, rail.d + .03), stripeMaterial);
    stripe.position.set(rail.x, .67, rail.z);
    scene.add(stripe);
  }
  const cornerGeometry = new THREE.CylinderGeometry(.22, .3, 2.8, 8);
  for (const x of [-9.1, 9.1]){
    for (const z of [-5.1, 5.1]){
      const post = new THREE.Mesh(cornerGeometry, railMaterial);
      post.position.set(x, 1.4, z);
      scene.add(post);
    }
  }
}

function resize(){
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
}

function clearFighters(){
  for (const visual of Object.values(fighterVisuals)){
    scene.remove(visual.group);
  }
  fighterVisuals = {};
}

function makeFighterVisual(definition, side){
  const group = new THREE.Group();
  group.userData.side = side;

  const shadow = new THREE.Mesh(
    new THREE.CircleGeometry(1.55, 32),
    new THREE.MeshBasicMaterial({color:0x000000, transparent:true, opacity:.57}),
  );
  shadow.rotation.x = -Math.PI / 2;
  shadow.position.y = .025;
  group.add(shadow);

  const colour = new THREE.Color(side === "p1" ? definition.palette.primary : definition.palette.accent);
  const ring = new THREE.Mesh(
    new THREE.TorusGeometry(1.48, .045, 6, 48),
    new THREE.MeshBasicMaterial({color:colour, transparent:true, opacity:.9}),
  );
  ring.rotation.x = Math.PI / 2;
  ring.position.y = .055;
  group.add(ring);

  const spriteMaterial = new THREE.SpriteMaterial({
    color:0xffffff,
    transparent:true,
    opacity:0,
    depthWrite:false,
  });
  const sprite = new THREE.Sprite(spriteMaterial);
  sprite.center.set(.5, 0);
  sprite.scale.set(4.4, 3, 1);
  sprite.position.y = .05;
  group.add(sprite);

  const fallback = new THREE.Mesh(
    new THREE.BoxGeometry(2.6, 1.25, 1.9),
    new THREE.MeshStandardMaterial({color:colour, roughness:.38, metalness:.82}),
  );
  fallback.position.y = .65;
  group.add(fallback);

  const applyTexture = (map) => {
    map.colorSpace = THREE.SRGBColorSpace;
    const aspect = map.image.width / map.image.height;
    const maxWidth = definition.id === "huge" ? 4.8 : 4.45;
    const maxHeight = definition.id === "huge" ? 3.75 : 3.1;
    const width = Math.min(maxWidth, maxHeight * aspect);
    const height = width / aspect;
    sprite.scale.set(width, height, 1);
    spriteMaterial.map = map;
    spriteMaterial.opacity = 1;
    spriteMaterial.needsUpdate = true;
    fallback.visible = false;
  };

  // Not every fighter has a tekkenized render yet (ingest/tekkenize.py has
  // only covered part of the roster) — fall back to the raw photo cutout
  // rather than leaving the coloured placeholder box up when one is missing.
  const rawImage = definition.image.replace("/bots_tekken/", "/bots/");
  textureLoader.load(definition.image, applyTexture, undefined,
    () => textureLoader.load(rawImage, applyTexture));

  group.position.set(side === "p1" ? -4.5 : 4.5, 0, 0);
  scene.add(group);
  return {
    group,
    sprite,
    ring,
    definition,
    attackPulse:0,
    hitFlashUntil:0,
  };
}

function beginMatch({playerId, opponentId}){
  currentMatchToken += 1;
  engine?.destroy();
  clearFighters();
  paused = false;
  const player = getRobotById(playerId);
  const opponent = getRobotById(opponentId);
  if (!player || !opponent) return;

  fighterVisuals.p1 = makeFighterVisual(player, "p1");
  fighterVisuals.p2 = makeFighterVisual(opponent, "p2");
  engine = new CombatEngine(player, opponent, {
    roundDuration:60,
    roundBreakDuration:2.15,
    bounds:{x:8.25, z:4.35},
    spawnDistance:4.5,
    aiEnabled:true,
    onEvent:handleCombatEvent,
  });
  engine.bindKeyboard(window);
  engine.start();
  startCiteTicker(playerId, opponentId);
}

/* ---- sourced-fact ticker: real, cited stats cycling under the fight ---- */
let citeFacts = [], citeIndex = 0, citeTimer = null;

function stopCiteTicker(){
  if (citeTimer) clearInterval(citeTimer);
  citeTimer = null;
  citeFacts = [];
  document.querySelector("#cite-ticker").classList.remove("is-visible");
}

function showNextCite(){
  const el = document.querySelector("#cite-ticker");
  if (!citeFacts.length){ el.classList.remove("is-visible"); return; }
  const f = citeFacts[citeIndex % citeFacts.length];
  citeIndex += 1;
  el.innerHTML = `<b>${f.id}</b>${f.text.replace(/[&<>]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]))}`;
  el.classList.add("is-visible");
}

async function startCiteTicker(playerId, opponentId){
  stopCiteTicker();
  const token = currentMatchToken;
  try{
    const res = await fetch(`/api/facts/${playerId}/${opponentId}`);
    if (!res.ok || token !== currentMatchToken) return;
    const data = await res.json();
    // Prefer the fact kinds that read as evidence rather than trivia —
    // record and head-to-head first, since those are what a judge asking
    // "is this cited or invented" would actually want to see.
    const order = {record:0, h2h:1, ko:2, underrated:3, overrated:3, hype:4, sos:5, weapon:6, quote:7};
    citeFacts = (data.facts || [])
      .slice()
      .sort((a, b) => (order[a.kind] ?? 9) - (order[b.kind] ?? 9))
      .slice(0, 8);
  } catch { citeFacts = []; }
  if (token !== currentMatchToken || !citeFacts.length) return;
  citeIndex = 0;
  showNextCite();
  citeTimer = setInterval(showNextCite, 4200);
}

function handleCombatEvent(event){
  const actorSide = event.actor?.side;
  const targetSide = event.target?.side;
  const actorUI = actorSide === "p1" ? "player" : "opponent";
  const targetUI = targetSide === "p1" ? "player" : "opponent";
  playCombatSound(event);

  if (event.type === "match-start"){
    ui.hideOverlay();
    combo.p1.count = combo.p2.count = 0;
  }

  if (event.type === "round-start"){
    roundFreezeUntil = performance.now() + 900;
    ui.showRound(event.round);
    ui.updateHUD({
      playerHealth:100,
      opponentHealth:100,
      timer:60,
      round:event.round,
      playerRounds:event.score.p1,
      opponentRounds:event.score.p2,
      matchState:"READY",
      immediate:true,
    });
  }

  if (event.type === "attack-start" && actorSide){
    fighterVisuals[actorSide].attackPulse = 1;
    ui.setStatus(actorUI, event.attack.name.toUpperCase(), "attack", 650);
  }

  if (event.type === "hit" && actorSide && targetSide){
    registerCombo(actorSide);
    fighterVisuals[targetSide].hitFlashUntil = performance.now() + 115;
    spawnHitBurst(event.position, actorSide);
    shake = Math.min(.58, shake + .18 + event.damage / 90);
    ui.setStatus(targetUI, `-${Math.round(event.damage)} DAMAGE`, "danger", 720);
  }

  if (event.type === "block" && targetSide){
    fighterVisuals[targetSide].hitFlashUntil = performance.now() + 65;
    spawnHitBurst(event.position, targetSide, true);
    shake = Math.min(.28, shake + .08);
    ui.setStatus(targetUI, "GUARD", "block", 500);
  }

  if (event.type === "ko"){
    ui.showKO(event.actor?.name || "");
    shake = .85;
  }

  if (event.type === "round-end"){
    ui.updateHUD({
      playerRounds:event.score.p1,
      opponentRounds:event.score.p2,
      matchState:event.reason === "ko" ? "K.O." : "TIME",
    });
    if (event.reason === "time"){
      ui.showOverlay(
        "time",
        "TIME",
        event.winner ? `${event.winner.name} TAKES THE ROUND` : "DRAW ROUND",
        {duration:1900, kicker:"60 SECONDS EXPIRED"},
      );
    }
  }

  if (event.type === "match-end"){
    const token = currentMatchToken;
    setTimeout(() => {
      if (token !== currentMatchToken || !engine || engine.getState().phase !== "match-over") return;
      ui.showMatchResult(event.winner?.name || "DRAW");
      ui.setStatus("player", "R — REMATCH", "neutral");
      ui.setStatus("opponent", "ESC — MENU", "neutral");
    }, 1450);
  }
}

function registerCombo(side){
  const now = performance.now();
  const record = combo[side];
  record.count = now - record.last < 1350 ? record.count + 1 : 1;
  record.last = now;
  ui.setCombo(side === "p1" ? "player" : "opponent", record.count);
  setTimeout(() => {
    if (performance.now() - record.last >= 1300){
      record.count = 0;
      ui.setCombo(side === "p1" ? "player" : "opponent", 0);
    }
  }, 1400);
}

function spawnHitBurst(position, side, blocked=false){
  const base = side === "p1" ? 0xff542f : 0x35d8ff;
  for (let index = 0; index < (blocked ? 8 : 15); index += 1){
    const material = sparkMaterial.clone();
    material.color.set(blocked ? 0xffffff : base);
    const mesh = new THREE.Mesh(sparkGeometry, material);
    mesh.position.set(position.x, .75 + Math.random() * .65, position.z);
    mesh.rotation.z = Math.random() * Math.PI;
    scene.add(mesh);
    sparks.push({
      mesh,
      life:.28 + Math.random() * .35,
      velocity:new THREE.Vector3(
        (Math.random() - .5) * 7,
        2.4 + Math.random() * 4.8,
        (Math.random() - .5) * 5,
      ),
    });
  }
}

function updateSparks(dt){
  for (let index = sparks.length - 1; index >= 0; index -= 1){
    const spark = sparks[index];
    spark.life -= dt;
    spark.velocity.y -= 9 * dt;
    spark.mesh.position.addScaledVector(spark.velocity, dt);
    spark.mesh.scale.x = Math.max(.05, spark.life * 2.4);
    spark.mesh.material.opacity = Math.max(0, spark.life * 2.2);
    spark.mesh.material.transparent = true;
    if (spark.life <= 0){
      scene.remove(spark.mesh);
      spark.mesh.material.dispose();
      sparks.splice(index, 1);
    }
  }
}

function renderFighters(state, dt, now){
  for (const side of ["p1", "p2"]){
    const fighter = state.fighters[side];
    const visual = fighterVisuals[side];
    if (!fighter || !visual) continue;

    visual.attackPulse = Math.max(0, visual.attackPulse - dt * 2.8);
    const action = fighter.attack;
    let lunge = 0;
    if (action){
      const total = action.startup + action.active + action.recovery;
      const progress = Math.min(1, action.elapsed / Math.max(.01, total));
      lunge = Math.sin(progress * Math.PI) * (.22 + action.damage / 42);
      visual.sprite.material.rotation =
        Math.sin(progress * Math.PI * 2) * (side === "p1" ? -.1 : .1);
    } else {
      visual.sprite.material.rotation *= .82;
    }

    const jitter = fighter.stunned ? Math.sin(now * .065) * .1 : 0;
    visual.group.position.x = fighter.position.x + Math.cos(fighter.facing) * lunge + jitter;
    visual.group.position.z = fighter.position.z + Math.sin(fighter.facing) * lunge;
    visual.group.position.y = Math.sin(now * .0022 + (side === "p1" ? 0 : 2)) * .035;
    const targetScale = 1 + visual.attackPulse * .055;
    visual.group.scale.lerp(new THREE.Vector3(targetScale, targetScale, targetScale), .2);

    visual.ring.material.opacity = fighter.blocking ? 1 : .62 + visual.attackPulse * .35;
    visual.ring.scale.setScalar(fighter.blocking ? 1.12 : 1);
    visual.sprite.material.color.set(now < visual.hitFlashUntil ? 0xffc56b : 0xffffff);
  }
}

function updateCamera(state, dt){
  const p1 = state?.fighters.p1.position || {x:-4.5, z:0};
  const p2 = state?.fighters.p2.position || {x:4.5, z:0};
  const centreX = (p1.x + p2.x) / 2;
  const centreZ = (p1.z + p2.z) / 2;
  const separation = Math.hypot(p2.x - p1.x, p2.z - p1.z);
  cameraTarget.set(centreX, 1.35, centreZ);
  desiredCamera.set(centreX * .2, 5.2 + Math.min(1.25, separation * .08), 12.6 + separation * .46 + centreZ);
  camera.position.lerp(desiredCamera, 1 - Math.exp(-3.8 * dt));
  if (shake > .001){
    camera.position.x += (Math.random() - .5) * shake;
    camera.position.y += (Math.random() - .5) * shake * .45;
    shake *= Math.exp(-8 * dt);
  }
  camera.lookAt(cameraTarget);
}

function handleTouchControl(action, pressed){
  if (!engine) return;
  if (action === "restart" && pressed){
    engine.restart();
    return;
  }
  if (action.startsWith("attack")){
    if (pressed) engine.tryAttack("p1", Number(action.at(-1)));
    return;
  }
  const codes = {
    forward:"KeyW",
    backward:"KeyS",
    sidestepLeft:"KeyA",
    sidestepRight:"KeyD",
    block:"Space",
  };
  const code = codes[action];
  if (!code) return;
  const event = {code, repeat:false, preventDefault(){}};
  if (pressed) engine.handleKeyDown(event);
  else engine.handleKeyUp(event);
}

function returnToSelect(){
  currentMatchToken += 1;
  engine?.destroy();
  engine = null;
  paused = false;
  clearFighters();
  ui.hideOverlay();
  stopCiteTicker();
}

function animate(){
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), .05);
  const now = performance.now();
  if (engine && !paused && now >= roundFreezeUntil) engine.update(dt);
  const state = engine?.getState() || null;

  if (state){
    renderFighters(state, dt, now);
    ui.updateHUD({
      playerHealth:state.fighters.p1.healthRatio * 100,
      opponentHealth:state.fighters.p2.healthRatio * 100,
      timer:state.roundTime,
      round:state.round,
      playerRounds:state.fighters.p1.roundsWon,
      opponentRounds:state.fighters.p2.roundsWon,
      matchState:paused ? "PAUSED" : state.phase === "fighting" ? "FIGHT" : state.phase.toUpperCase(),
    });
  }
  updateSparks(dt);
  updateCamera(state, dt);
  renderer.render(scene, camera);
}

initScene();
ui = createFighterUI({
  root:"#fighter-ui-root",
  roster:ROBOT_LIST,
  initialPlayer:0,
  initialOpponent:1,
  onStart:beginMatch,
  onPause(nextPaused){
    paused = nextPaused;
    if (!engine) return;
    if (paused) engine.unbindKeyboard();
    else engine.bindKeyboard(window);
  },
  onRestart(){
    engine?.restart();
  },
  onReturnToSelect:returnToSelect,
  onControl:handleTouchControl,
});
addEventListener("keydown", (event) => {
  if (event.code === "KeyM" && !event.repeat){
    event.preventDefault();
    toggleAudio();
  }
});
animate();
</script>
</body>
</html>
