<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>BOT BEEF — sprites</title>
<link rel="stylesheet" href="/css/tekken.css">
<style>
  /* Aliases onto the shared Tekken theme in css/tekken.css, which owns the values. */
  :root{
    --bg:var(--tk-steel-0);--panel:var(--tk-steel-1);--line:var(--tk-line);
    --ink:var(--tk-ink);--dim:var(--tk-dim);--a:var(--tk-p1);
    --ok:var(--tk-ok);--bad:var(--tk-danger);--mono:var(--tk-mono)
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    color:var(--ink);
    font:700 15px/1.5 var(--tk-display);
    padding:26px;min-height:100vh;
    background:
      linear-gradient(115deg, #ff23181a, transparent 30%),
      linear-gradient(245deg, #1cd2ff1a, transparent 30%),
      radial-gradient(ellipse at 50% 0%, var(--tk-steel-2) 0, #0b1016 46%, #030405 100%);
  }
  /* scanline pass */
  body::after{
    content:"";position:fixed;inset:0;z-index:99;pointer-events:none;
    opacity:.11;mix-blend-mode:multiply;
    background:repeating-linear-gradient(180deg,transparent 0 3px,#00000099 4px);
  }
  header{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:8px}
  h1{
    font-size:28px;font-style:italic;font-weight:900;letter-spacing:-.035em;
    text-transform:uppercase;text-shadow:3px 3px 0 #050608,0 0 26px #ffffff26;
    transform:skewX(-4deg)
  }
  h1 em{font-style:inherit;color:#ff4637}
  .sub{
    color:var(--dim);font:700 12px/1.6 var(--mono);letter-spacing:.1em;
    text-transform:uppercase;margin-bottom:20px
  }
  .sub b{color:var(--tk-chrome);font-variant-numeric:tabular-nums}
  .tools{display:flex;gap:8px;margin-bottom:20px;flex-wrap:wrap}
  button{
    color:var(--ink);border:1px solid var(--tk-line-hi);border-radius:0;
    padding:10px 15px;cursor:pointer;
    font:700 11px/1 var(--mono);letter-spacing:.15em;text-transform:uppercase;
    background:
      linear-gradient(180deg,#ffffff1a,transparent 44%),
      linear-gradient(90deg,#222b34,var(--tk-steel-1));
    box-shadow:inset 0 0 0 2px #00000099;
    /* sheared with clip-path so labels stay upright */
    clip-path:polygon(9px 0,100% 0,calc(100% - 9px) 100%,0 100%);
    transition:filter .15s ease,border-color .15s ease
  }
  button:hover{filter:brightness(1.12);border-color:var(--tk-chrome)}
  button:focus-visible{outline:2px solid #fff;outline-offset:2px}
  button.on{
    border-color:var(--tk-warning);color:#05070a;
    background:linear-gradient(180deg,#ffe37a,var(--tk-warning) 48%,#d9a800);
    box-shadow:inset 0 0 0 2px #000,0 0 20px #ffd33d66
  }

  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:16px}
  /* steel plate with the double chrome bevel, notched like a fighter card */
  .card{
    border:1px solid var(--tk-line-hi);border-radius:0;
    padding:13px;display:flex;flex-direction:column;gap:9px;
    background:
      linear-gradient(155deg,#ffffff1f,transparent 30%),
      linear-gradient(180deg,var(--tk-steel-2),#080b0f 76%);
    box-shadow:inset 0 0 0 3px #0a0d11,inset 0 0 0 4px #ffffff1a,0 12px 26px #000a;
    clip-path:polygon(14px 0,100% 0,100% calc(100% - 14px),calc(100% - 14px) 100%,0 100%,0 14px)
  }
  .shot{height:150px;display:flex;align-items:center;justify-content:center;
        position:relative;overflow:hidden;box-shadow:inset 0 0 0 1px #ffffff14}
  /* checkerboard proves the alpha channel is real rather than a white box */
  .shot.checks{background-image:
      linear-gradient(45deg,#1b1f28 25%,transparent 25%),
      linear-gradient(-45deg,#1b1f28 25%,transparent 25%),
      linear-gradient(45deg,transparent 75%,#1b1f28 75%),
      linear-gradient(-45deg,transparent 75%,#1b1f28 75%);
    background-size:16px 16px;
    background-position:0 0,0 8px,8px -8px,-8px 0}
  .shot.dark{background:#05060a}
  .shot.arena{background:linear-gradient(180deg,#1a2338,#0b1018)}
  .shot img{max-width:100%;max-height:100%;object-fit:contain}
  .nm{
    font-size:19px;font-style:italic;font-weight:900;text-transform:uppercase;
    letter-spacing:-.02em;text-shadow:2px 2px 0 #050608
  }
  .meta{font:700 11px/1.6 var(--mono);color:var(--dim);letter-spacing:.08em;
        font-variant-numeric:tabular-nums}
  .tag{display:inline-block;font:700 10px/1 var(--mono);letter-spacing:.16em;
       text-transform:uppercase;padding:5px 8px;border-radius:0;
       background:#05070a99;border:1px solid currentColor;color:var(--dim)}
  .tag.ok{color:var(--ok)}
  .tag.bad{color:var(--bad)}
  .missing{
    grid-column:1/-1;border:1px solid var(--bad);border-radius:0;padding:17px;
    background:linear-gradient(180deg,#2a1218,#12080c 78%);
    box-shadow:inset 0 0 0 3px #0a0d11,inset 0 0 0 4px #ff516826;
    clip-path:polygon(14px 0,100% 0,100% calc(100% - 14px),calc(100% - 14px) 100%,0 100%,0 14px)
  }
  .missing h3{
    color:var(--bad);font:700 12px/1 var(--mono);margin-bottom:9px;
    letter-spacing:.18em;text-transform:uppercase
  }
  .missing p{color:var(--tk-muted);font-size:14px;line-height:1.55}
  a.back{
    color:var(--tk-muted);font:700 10px/1 var(--mono);letter-spacing:.15em;
    text-decoration:none;text-transform:uppercase;
    border:1px solid var(--tk-line-hi);padding:9px 13px;border-radius:0;
    background:linear-gradient(180deg,#ffffff1a,transparent 44%),linear-gradient(90deg,#222b34,var(--tk-steel-1));
    box-shadow:inset 0 0 0 2px #00000099;
    clip-path:polygon(9px 0,100% 0,calc(100% - 9px) 100%,0 100%);
    transition:filter .15s ease,color .15s ease
  }
  a.back:hover,a.back:focus-visible{color:#fff;filter:brightness(1.12)}
</style>
</head>
<body>

<header>
  <h1>BOT <em>BEEF</em> — SPRITES</h1>
  <a class="back" href="/">modes</a>
  <a class="back" href="/data">data view</a>
  <a class="back" href="/fight">fight mode ▶</a>
</header>
<div class="sub" id="sub">loading…</div>

<div class="tools">
  <button class="on" data-bg="checks">Checkerboard</button>
  <button data-bg="dark">Arena black</button>
  <button data-bg="arena">Stage gradient</button>
  <button id="sortSize">Sort by size</button>
</div>

<div class="grid" id="grid"></div>

<script>
const $ = s => document.querySelector(s);
let SPRITES = [], ROSTER = {}, bySize = false;

async function boot(){
  const [sprites, table] = await Promise.all([
    fetch('/bots/sprites.json').then(r => r.json()),
    fetch('/api/table').then(r => r.json()).catch(() => ({rows: []}))
  ]);
  SPRITES = sprites;
  const bots = await fetch('/api/bots').then(r => r.json());
  for (const b of bots.bots) ROSTER[b.slug] = b;

  const scored = new Set(table.rows.map(r => r.slug));
  const withSprite = new Set(SPRITES.map(s => s.slug));
  const missing = table.rows.filter(r => !withSprite.has(r.slug)).map(r => r.name);

  $('#sub').innerHTML =
    `<b>${SPRITES.length}</b> sprites on disk · ` +
    `<b>${SPRITES.filter(s => scored.has(s.slug)).length}</b> also have a score row · ` +
    `all cut out with a real alpha channel`;

  render(missing);
}

function render(missing){
  const list = [...SPRITES];
  if (bySize) list.sort((a, b) => (b.w * b.h) - (a.w * a.h));
  else list.sort((a, b) => a.slug.localeCompare(b.slug));

  const bg = document.querySelector('[data-bg].on')?.dataset.bg || 'checks';

  let html = list.map(s => {
    const bot = ROSTER[s.slug] || {};
    const small = s.w < 380;
    return `
      <div class="card">
        <div class="shot ${bg}"><img src="/bots/${s.slug}.png" alt="${s.slug}" loading="lazy"></div>
        <div class="nm">${bot.name || s.slug}</div>
        <div class="meta">${s.w}×${s.h} · ${s.kb} KB</div>
        <div>
          <span class="tag ${small ? 'bad' : 'ok'}">${small ? 'low-res' : 'sharp'}</span>
          <span class="tag ok">alpha ${s.alpha_min}–${s.alpha_max}</span>
        </div>
      </div>`;
  }).join('');

  if (missing && missing.length){
    html += `<div class="missing">
      <h3>NO SPRITE (${missing.length})</h3>
      <p>${missing.join(', ')} — these bots have a score row but no usable photo,
      so the arena falls back to a lit silhouette. Bite Force is here on purpose:
      its battlebots.com page carries no image that actually names the bot, only
      team shots and an unrelated robot, so the scraper now refuses it rather than
      putting the wrong machine on stage.</p></div>`;
  }
  $('#grid').innerHTML = html;
}

document.querySelectorAll('[data-bg]').forEach(b => b.onclick = () => {
  document.querySelectorAll('[data-bg]').forEach(x => x.classList.remove('on'));
  b.classList.add('on');
  boot();
});
$('#sortSize').onclick = e => { bySize = !bySize; e.target.classList.toggle('on', bySize); boot(); };
boot();
</script>
</body>
</html>
