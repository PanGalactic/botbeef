<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>BOT BEEF — ARENA</title>
<style>
  :root{ --a:#ff6b35; --b:#35c8ff; --ink:#fff; }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;overflow:hidden;background:#05060a;color:var(--ink);
    font:16px/1.4 ui-sans-serif,-apple-system,"Segoe UI",Roboto,sans-serif}
  canvas{display:block;position:fixed;inset:0}

  #ui{position:fixed;inset:0;pointer-events:none;display:flex;flex-direction:column}

  /* ---- Tekken-style top HUD: two bars closing toward the centre ---- */
  .hud{display:flex;align-items:flex-start;gap:18px;padding:20px 26px 0}
  .side{flex:1;min-width:0}
  .side.r{text-align:right}
  .nm{font-size:26px;font-weight:900;letter-spacing:.06em;text-transform:uppercase;
      text-shadow:0 2px 14px #000,0 0 30px rgba(0,0,0,.9)}
  .side.l .nm{color:var(--a)} .side.r .nm{color:var(--b)}
  .meter{height:19px;margin-top:7px;background:rgba(0,0,0,.62);
         border:2px solid rgba(255,255,255,.28);position:relative;overflow:hidden;
         transform:skewX(-22deg)}
  .meter i{position:absolute;inset:0;width:0;transition:width 1.1s cubic-bezier(.2,.9,.2,1)}
  .side.l .meter i{background:linear-gradient(90deg,#ffb347,var(--a));right:0;left:auto}
  .side.r .meter i{background:linear-gradient(90deg,var(--b),#7ae7ff)}
  .meter.small{height:11px;margin-top:5px;opacity:.85}
  .lg{font:10px/1 ui-monospace,Menlo,monospace;letter-spacing:.16em;opacity:.68;
      margin-top:6px;text-transform:uppercase}
  .mid{flex:0 0 130px;text-align:center;padding-top:4px}
  .round{font:11px/1 ui-monospace,Menlo,monospace;letter-spacing:.3em;opacity:.6}
  .vs{font-size:40px;font-weight:900;font-style:italic;letter-spacing:-.03em;
      text-shadow:0 0 26px rgba(255,107,53,.75)}

  /* ---- subtitle: the bar being spoken, plus its citation ---- */
  .foot{margin-top:auto;padding:0 0 30px;display:flex;justify-content:center}
  .sub{max-width:1180px;padding:0 40px;text-align:center;opacity:0;
       transform:translateY(14px);transition:opacity .3s,transform .3s}
  .sub.on{opacity:1;transform:none}
  .who{font:12px/1 ui-monospace,Menlo,monospace;letter-spacing:.24em;
       text-transform:uppercase;margin-bottom:11px}
  .who.a{color:var(--a)} .who.b{color:var(--b)}
  .line{font-size:39px;line-height:1.22;font-weight:800;
        text-shadow:0 3px 22px #000,0 0 46px rgba(0,0,0,.95)}
  .cite{margin-top:14px;font:13px/1.5 ui-monospace,Menlo,monospace;
        color:#a8b0c2;background:rgba(0,0,0,.55);display:inline-block;
        padding:7px 15px;border-radius:5px;border:1px solid rgba(255,255,255,.13)}
  .cite b{color:#2ee6a8}

  /* ---- splash + controls ---- */
  #splash{position:fixed;inset:0;display:flex;flex-direction:column;
          align-items:center;justify-content:center;gap:26px;
          background:radial-gradient(ellipse at center,#10131c,#05060a 70%);
          transition:opacity .5s}
  #splash.gone{opacity:0;pointer-events:none}
  #splash h1{font-size:72px;font-weight:900;letter-spacing:.1em}
  #splash h1 em{font-style:normal;color:var(--a)}
  .pick{display:flex;gap:14px;align-items:center;pointer-events:auto}
  select,button{font:inherit;font-size:16px;color:#fff;background:#14171f;
    border:1px solid #2a2f3c;border-radius:8px;padding:11px 14px;cursor:pointer}
  button.go{background:var(--a);color:#05060a;border-color:var(--a);
    font-weight:900;letter-spacing:.1em;padding:11px 30px}
  .hint{font:12px/1.6 ui-monospace,Menlo,monospace;color:#6d768a;text-align:center}
  a.back{position:fixed;bottom:16px;left:20px;pointer-events:auto;color:#8b93a6;
    font:11px/1 ui-monospace,Menlo,monospace;letter-spacing:.14em;text-decoration:none;
    text-transform:uppercase;border:1px solid #2a2f3c;padding:9px 13px;border-radius:6px;
    background:rgba(0,0,0,.5)}
  a.back:hover{color:#fff}
</style>
</head>
<body>

<div id="ui">
  <div class="hud">
    <div class="side l">
      <div class="nm" id="nmA">—</div>
      <div class="meter"><i id="hypeA"></i></div>
      <div class="lg">Fan hype</div>
      <div class="meter small"><i id="perfA"></i></div>
      <div class="lg">Record</div>
    </div>
    <div class="mid">
      <div class="round" id="round">ROUND 1</div>
      <div class="vs">VS</div>
    </div>
    <div class="side r">
      <div class="nm" id="nmB">—</div>
      <div class="meter"><i id="hypeB"></i></div>
      <div class="lg">Fan hype</div>
      <div class="meter small"><i id="perfB"></i></div>
      <div class="lg">Record</div>
    </div>
  </div>

  <div class="foot">
    <div class="sub" id="sub">
      <div class="who" id="subWho"></div>
      <div class="line" id="subLine"></div>
      <div class="cite" id="subCite"></div>
    </div>
  </div>
</div>

<a class="back" href="/">◀ data view</a>

<div id="splash">
  <h1>BOT <em>BEEF</em></h1>
  <div class="pick">
    <select id="selA"></select>
    <span style="color:#6d768a">VS</span>
    <select id="selB"></select>
    <button class="go" id="go">FIGHT</button>
  </div>
  <div class="hint" id="hint">loading…</div>
</div>

<audio id="au"></audio>

<script type="module">
import * as THREE from '/vendor/three.module.js';

const $ = s => document.querySelector(s);
let TABLE=null, BATTLE=null, QUEUE=[], qi=0;
let scene, cam, renderer, fighters={}, clock;
const tex = new THREE.TextureLoader();

/* ---------------------------------------------------------------- scene */
function initScene(){
  scene = new THREE.Scene();
  scene.fog = new THREE.FogExp2(0x05060a, 0.031);

  cam = new THREE.PerspectiveCamera(46, innerWidth/innerHeight, 0.1, 260);
  cam.position.set(0, 3.1, 15.5);

  renderer = new THREE.WebGLRenderer({antialias:true});
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  renderer.setSize(innerWidth, innerHeight);
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1.18;
  document.body.prepend(renderer.domElement);

  // floor — FLUX-generated plate texture, tiled
  const floorTex = tex.load('/arena/floor.png', t => {
    t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(7,7);
  });
  const floor = new THREE.Mesh(
    new THREE.PlaneGeometry(150,150),
    new THREE.MeshStandardMaterial({map:floorTex, roughness:.72, metalness:.45,
      color:0x8892a4})
  );
  floor.rotation.x = -Math.PI/2;
  scene.add(floor);

  // Backdrop — FLUX arena interior wrapped on the inside of a cylinder, so
  // it reads as surrounding depth rather than flat wallpaper.
  // fog:false is load-bearing: at this radius exponential fog would erase it
  // completely and the stage goes black above the floor line.
  tex.load('/arena/arena.png', t => {
    t.colorSpace = THREE.SRGBColorSpace;
    t.wrapS = THREE.RepeatWrapping; t.repeat.x = 2;
    const back = new THREE.Mesh(
      new THREE.CylinderGeometry(40, 40, 34, 64, 1, true),
      new THREE.MeshBasicMaterial({map:t, side:THREE.BackSide,
        color:0x7f8ba6, fog:false})
    );
    back.position.y = 15;
    scene.add(back);
  });

  scene.add(new THREE.AmbientLight(0x35406a, 1.5));

  const key = new THREE.SpotLight(0xffffff, 320, 60, 0.44, 0.55, 1.6);
  key.position.set(0, 21, 9); scene.add(key);

  const rimA = new THREE.PointLight(0xff6b35, 190, 40, 2);
  rimA.position.set(-9, 4.2, 3); scene.add(rimA);
  const rimB = new THREE.PointLight(0x35c8ff, 190, 40, 2);
  rimB.position.set(9, 4.2, 3); scene.add(rimB);

  // hanging truss lights for the stage read
  for (let i=-2;i<=2;i++){
    const l = new THREE.PointLight(0x6f7fbf, 46, 46, 2);
    l.position.set(i*11, 15, -6); scene.add(l);
  }

  clock = new THREE.Clock();
  addEventListener('resize', () => {
    cam.aspect = innerWidth/innerHeight; cam.updateProjectionMatrix();
    renderer.setSize(innerWidth, innerHeight);
  });
  animate();
}

/* A fighter is a lit billboard carrying the bot's real photo cutout.
   Real photography is the point — the bots must read as their actual
   real-world machines, which no text-to-image model can fake. */
function makeFighter(slug, side){
  const group = new THREE.Group();
  const x = side * 5.0;

  const plane = new THREE.Mesh(
    new THREE.PlaneGeometry(6.2, 4.2),
    new THREE.MeshBasicMaterial({transparent:true, opacity:0,
      side:THREE.DoubleSide, depthWrite:false})
  );
  plane.position.y = 2.1;
  group.add(plane);

  tex.load(`/bots/${slug}.png`,
    t => {
      t.colorSpace = THREE.SRGBColorSpace;
      // Fit every fighter into the same box. Normalising on height alone
      // makes a wide bot (Black Dragon) tower over a tall one (Bite Force);
      // fitting both dimensions keeps the matchup looking like a matchup.
      const ar = t.image.width / t.image.height;
      const BOX_W = 6.4, BOX_H = 4.0;
      const w = (ar > BOX_W / BOX_H) ? BOX_W : BOX_H * ar;
      const h = (ar > BOX_W / BOX_H) ? BOX_W / ar : BOX_H;
      plane.geometry.dispose();
      plane.geometry = new THREE.PlaneGeometry(w, h);
      plane.position.y = h/2 * 0.98;
      plane.material.map = t;
      plane.material.opacity = 1;
      plane.material.needsUpdate = true;
      group.userData.hasPhoto = true;
    },
    undefined,
    () => {
      // No photo scraped yet: a lit silhouette block, so the scene still
      // stages correctly and it's obvious what's missing.
      plane.material.opacity = 0;
      // Low metalness + emissive on purpose. A MeshStandardMaterial with high
      // metalness and NO environment map renders black however many lights you
      // point at it — metals show reflections, and there's nothing to reflect.
      // A placeholder nobody can see is worse than no placeholder.
      const box = new THREE.Mesh(
        new THREE.BoxGeometry(3.1, 2.0, 2.4),
        new THREE.MeshStandardMaterial({
          color: side < 0 ? 0x8a4a24 : 0x1f6f92,
          emissive: side < 0 ? 0x2a1206 : 0x06202a,
          emissiveIntensity: 0.9,
          roughness: 0.55, metalness: 0.1})
      );
      box.position.y = 1.0;
      group.add(box);
      group.userData.hasPhoto = false;
    });

  // contact shadow so the fighter sits on the floor rather than hovering
  const shadow = new THREE.Mesh(
    new THREE.CircleGeometry(2.5, 32),
    new THREE.MeshBasicMaterial({color:0x000000, transparent:true, opacity:.5})
  );
  shadow.rotation.x = -Math.PI/2;
  shadow.position.y = 0.02;
  group.add(shadow);

  group.position.set(x, 0, 0);
  group.rotation.y = side * -0.19;
  scene.add(group);
  return group;
}

let camTarget = new THREE.Vector3(0, 2.4, 0);
let camPos = new THREE.Vector3(0, 3.1, 15.5);
let speaking = null;

function animate(){
  requestAnimationFrame(animate);
  const t = clock.getElapsedTime();

  for (const [slug, g] of Object.entries(fighters)){
    const lead = speaking === slug;
    // idle bob; the bot on the mic leans in and rides higher
    g.position.y = Math.sin(t*1.7 + g.position.x) * 0.09 + (lead ? 0.3 : 0);
    const want = lead ? Math.sign(g.position.x) * 4.1 : Math.sign(g.position.x) * 5.0;
    g.position.x += (want - g.position.x) * 0.05;
    g.scale.setScalar(g.scale.x + ((lead ? 1.1 : 1.0) - g.scale.x) * 0.07);
  }

  cam.position.lerp(camPos, 0.035);
  cam.lookAt(camTarget);
  cam.position.y += Math.sin(t*0.7) * 0.006;
  renderer.render(scene, cam);
}

function cutTo(slug){
  speaking = slug;
  const g = fighters[slug];
  if (!g){ camPos.set(0,3.4,15.5); camTarget.set(0,2.4,0); return; }
  const side = Math.sign(g.position.x);
  // over-the-shoulder from the opponent's side — the fighting-game angle
  camPos.set(side * 6.4, 3.0, 8.4);
  camTarget.set(side * 3.2, 2.3, 0);
}

function wideShot(){
  speaking = null;
  camPos.set(0, 3.6, 15.0);
  camTarget.set(0, 2.5, 0);
}

/* ----------------------------------------------------------------- data */
async function boot(){
  const [t, cached, sprites] = await Promise.all([
    fetch('/api/table').then(r=>r.json()),
    fetch('/api/battles').then(r=>r.json()),
    fetch('/bots/sprites.json').then(r=>r.json()).catch(()=>[])
  ]);
  TABLE = t;

  // Only offer fighters we can actually show. A bot with no photo renders as
  // a placeholder block, and a placeholder on stage reads as a broken app —
  // better that it simply isn't on the menu.
  const haveSprite = new Set(sprites.map(s => s.slug));
  const rows = t.rows.filter(r => haveSprite.has(r.slug));
  const benched = t.rows.filter(r => !haveSprite.has(r.slug)).map(r => r.name);

  for (const sel of [$('#selA'), $('#selB')])
    sel.innerHTML = rows.map(r=>`<option value="${r.slug}">${r.name}</option>`).join('');

  const first = (cached.battles||[])[0];
  $('#selA').value = first ? first.a : rows[0].slug;
  $('#selB').value = first ? first.b : rows[rows.length-1].slug;

  const n = (cached.battles||[]).length;
  const prov = t.provenance.is_real
    ? 'data scraped'
    : '<span style="color:#ff2e4d">PLACEHOLDER DATA</span>';
  const bench = benched.length
    ? `<br><span style="opacity:.7">${benched.join(', ')} benched — no usable photo</span>`
    : '';
  $('#hint').innerHTML = `${rows.length} fighters · ${n} battles ready · ${prov}${bench}`;

  initScene();
}

function meter(el, v){ el.style.width = Math.max(4, Math.min(100, v)) + '%'; }

async function fight(){
  const a = $('#selA').value, b = $('#selB').value;
  if (a === b) return;

  let d;
  try {
    const res = await fetch(`/api/battle/${a}/${b}`);
    if (!res.ok) throw 0;
    d = await res.json();
  } catch {
    $('#hint').innerHTML = `<span style="color:#ff2e4d">no battle cached for that pair</span> —
      run: python3 ingest/pregen.py ${a} ${b}`;
    return;
  }
  BATTLE = d;

  const ra = TABLE.rows.find(r=>r.slug===a), rb = TABLE.rows.find(r=>r.slug===b);
  $('#nmA').textContent = d.names[a];
  $('#nmB').textContent = d.names[b];
  meter($('#hypeA'), ra.hype); meter($('#perfA'), ra.performance);
  meter($('#hypeB'), rb.hype); meter($('#perfB'), rb.performance);

  for (const g of Object.values(fighters)) scene.remove(g);
  fighters = { [a]: makeFighter(a, -1), [b]: makeFighter(b, +1) };

  $('#splash').classList.add('gone');
  wideShot();

  QUEUE = [];
  if (d.audio){
    if (d.audio.intro) QUEUE.push({i:-1, f:d.audio.intro});
    for (const m of d.audio.bars) QUEUE.push({i:m.index, f:m.file});
  } else {
    d.bars.forEach((_,i)=>QUEUE.push({i, f:null}));
  }
  qi = 0;
  next();
}

function next(){
  if (qi >= QUEUE.length){
    wideShot();
    $('#sub').classList.remove('on');
    $('#round').textContent = 'K.O.';
    setTimeout(()=>$('#splash').classList.remove('gone'), 2600);
    return;
  }
  const step = QUEUE[qi++];
  const au = $('#au');

  if (step.i < 0){
    wideShot();
    $('#sub').classList.remove('on');
  } else {
    const bar = BATTLE.bars[step.i];
    const isA = bar.bot === BATTLE.a;
    cutTo(bar.bot);
    $('#round').textContent = `ROUND ${step.i < 8 ? 1 : 2}`;
    $('#subWho').className = 'who ' + (isA ? 'a' : 'b');
    $('#subWho').textContent = BATTLE.names[bar.bot];
    $('#subLine').textContent = bar.text;
    $('#subCite').innerHTML = `<b>${bar.fact_id}</b> ${esc(bar.fact)}`;
    $('#sub').classList.add('on');
  }

  // Silent mode has to stay READABLE. The audio manifests are committed but
  // the rendered WAVs are not (77 MB), so a fresh clone — a Codespace, a
  // teammate's laptop — has manifest entries pointing at files that 404.
  // Advancing on the error event would flash the whole battle past in a
  // second, so fall back to a reading-paced timer instead.
  const hold = step.i < 0 ? 3200
    : Math.max(2600, 380 * (BATTLE.bars[step.i].text.split(/\s+/).length));

  if (!step.f){ setTimeout(next, hold); return; }
  au.src = '/audio/' + step.f;
  au.onended = next;
  au.onerror = () => setTimeout(next, hold);
  au.play().catch(() => setTimeout(next, hold));
}

function esc(s){ return String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c])); }

$('#go').onclick = fight;
boot();
</script>
</body>
</html>
